<style>
  :root{
    --bg:#F3EEE9;
    --navy-deep:#0A1E36;
    --navy-mid:#123259;
    --gold:#C9A24E;
    --gold-light:#E7CD86;
    --gold-deep:#A97C24;
    --ink:#16263D;
    --muted:#66748C;
    --muted-on-navy:#9FB2CE;
    --linkedin:#0A66C2;
    --whatsapp:#22B858;
    --outline:rgba(22,38,61,0.2);
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:var(--bg);
  }

  body{
    display:flex;
    align-items:stretch;
    justify-content:center;
    font-family:'Manrope', sans-serif;
  }

  .card{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:56px 30px 40px;
    text-align:center;
    color:var(--ink);
    opacity:0;
    transform:translateY(14px);
    animation:rise 0.7s ease-out forwards;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
  }

  .wordmark{
    font-family:'Boston Angel', cursive;
    font-weight:700;
    font-size:clamp(58px, 15vw, 68px);
    line-height:1.3;
    letter-spacing:0.5px;
    margin:0;
  }

  .wordmark .accent{ color:var(--gold-deep); }

  .tagline{
    margin:6px 0 0;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:2.6px;
    text-transform:uppercase;
    color:var(--muted);
  }

  .photo-wrap{
    width:200px;
    height:200px;
    margin:32px auto 22px;
    border-radius:50%;
    padding:3px;
    background:linear-gradient(160deg, var(--gold-light), var(--gold));
  }

  .photo-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--navy-mid);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .photo-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .photo-inner svg{
    width:56%;
    height:56%;
    color:var(--muted-on-navy);
  }

  .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:23px;
    margin:0;
  }

  .title{
    margin:5px 0 0;
    font-size:14.5px;
    font-weight:500;
    color:var(--muted);
  }

  .tags{
    margin:16px auto 0;
    max-width:280px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--gold-deep);
    line-height:1.7;
  }

  .divider{
    width:44px;
    height:2px;
    background:var(--outline);
    border-radius:2px;
    margin:26px auto;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:52px;
    border-radius:14px;
    font-family:'Manrope', sans-serif;
    font-size:14.5px;
    font-weight:700;
    text-decoration:none;
    border:1.5px solid transparent;
    cursor:pointer;
    transition:transform 0.15s ease, filter 0.15s ease;
  }

  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ transform:scale(0.98); }

  .btn:focus-visible{
    outline:2px solid var(--gold-light);
    outline-offset:2px;
  }

  .btn svg{ width:18px; height:18px; flex-shrink:0; }

  .btn-linkedin{ background:var(--linkedin); color:#fff; }
  .btn-whatsapp{ background:var(--whatsapp); color:#06210F; }

  .btn-outline{
    background:transparent;
    border-color:var(--outline);
    color:var(--ink);
  }

  .btn-gold{
    background:linear-gradient(160deg, var(--gold-light), var(--gold));
    color:var(--navy-deep);
  }

  .footer-tag{
    margin:28px 0 0;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:2.2px;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0.9;
  }

  .footer-tag::before{
    content:'';
    display:block;
    width:58px;
    height:2px;
    margin:0 auto 10px;
    background:var(--gold);
  }
</style>
</head>
<body>

<div class="card">
  <p class="wordmark">Ve<span class="accent">Q</span>tora</p>
  <p class="tagline" id="taglineEl">From deep technology to enterprise adoption</p>

  <div class="photo-wrap">
    <div class="photo-inner" id="photoInner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
    </div>
  </div>

  <p class="name" id="nameEl">Aarti Aruldas</p>
  <p class="title" id="titleEl">Founder, VeQtora</p>
  <p class="tags" id="tagsEl">PQC · Blockchain · AI Digital Infrastructure</p>

  <div class="divider"></div>

  <div class="links">
    <a class="btn btn-linkedin" id="linkedinBtn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="16" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor" font-family="Manrope, sans-serif">in</text></svg>
      Connect on LinkedIn
    </a>

    <a class="btn btn-whatsapp" id="whatsappBtn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20l1.4-4.1A7.9 7.9 0 1 1 9 18.6L4 20Z"/></svg>
      Message on WhatsApp
    </a>

    <a class="btn btn-outline" id="websiteBtn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"/></svg>
      Visit Website
    </a>

    <a class="btn btn-outline" id="emailBtn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 6.5 8 6 8-6"/></svg>
      Email Me
    </a>

    <button class="btn btn-gold" id="saveContactBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9.5" cy="10.5" r="2"/><path d="M6 17c.6-2 2-3 3.5-3s2.9 1 3.5 3"/><path d="M15 9h3M15 13h3"/></svg>
      Save Contact
    </button>
  </div>

  <p class="footer-tag">Ideas. Connections. Opportunities. Real impact.</p>
</div>

<script>
  /* ============================================================
     EDIT THIS SECTION — put your real details in, then save.
     Everything on the page (text, links, and the Save Contact
     file) is generated from these values.
     ============================================================ */
  const CONTACT = {
    name: "Aarti Aruldas",
    firstName: "Aarti",
    lastName: "Aruldas",
    title: "Founder, VeQtora",
    org: "VeQtora",
    tagline: "From deep technology to enterprise adoption",
    tags: "PQC · Blockchain · AI Digital Infrastructure",

    linkedinUrl: "https://www.linkedin.com/in/aartiaruldas",

    // Digits only, country code first, no + or spaces, e.g. "919876543210"
    whatsappNumber: "919833180255",
    whatsappMessage: "Hi Aarti, I found your VeQtora card and would love to connect!",

    websiteUrl: "https://veqtora.in",
    email: "aartiaruldas@veqtora.in",

    // Optional: paste an image URL, or a data:image/... URI, to replace
    // the placeholder icon. Leave blank ("") to keep the placeholder.
    photoUrl: "profile-photo.jpg"
  };
  /* ============================================================ */

  document.addEventListener('contextmenu', function (event) {
    event.preventDefault();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'F12' || (event.ctrlKey && event.key.toLowerCase() === 'u')) {
      event.preventDefault();
    }
  });

  document.getElementById('taglineEl').textContent = CONTACT.tagline;
  document.getElementById('nameEl').textContent = CONTACT.name;
  document.getElementById('titleEl').textContent = CONTACT.title;
  document.getElementById('tagsEl').textContent = CONTACT.tags;
  document.title = CONTACT.name + " · " + CONTACT.org;

  document.getElementById('linkedinBtn').href = CONTACT.linkedinUrl;
  document.getElementById('websiteBtn').href = CONTACT.websiteUrl;
  document.getElementById('emailBtn').href = "mailto:" + CONTACT.email;
  document.getElementById('whatsappBtn').href =
    "https://wa.me/" + CONTACT.whatsappNumber + "?text=" + encodeURIComponent(CONTACT.whatsappMessage);

  if (CONTACT.photoUrl) {
    const img = document.createElement('img');
    img.src = CONTACT.photoUrl;
    img.alt = CONTACT.name;
    const wrap = document.getElementById('photoInner');
    wrap.innerHTML = "";
    wrap.appendChild(img);
  }

  document.getElementById('saveContactBtn').addEventListener('click', function () {
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + CONTACT.lastName + ";" + CONTACT.firstName + ";;;",
      "FN:" + CONTACT.name,
      "ORG:" + CONTACT.org,
      "TITLE:" + CONTACT.title,
      "TEL;TYPE=CELL:+91 98331 80255",
      "EMAIL:" + CONTACT.email,
      "URL:" + CONTACT.websiteUrl,
      "END:VCARD"
    ].join("\n");

    try {
      const blob = new Blob([vcard], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = CONTACT.name.replace(/\s+/g, "-") + ".vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error("Could not save contact:", err);
    }
  });
</script>

</body>
</html>
